<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplayer UNO</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="login-screen" class="screen">
        <h1>Multiplayer UNO</h1>
        <input type="text" id="player-name" placeholder="Enter your name" />
        <div class="menu-options" style="margin-top: 20px;">
            <button id="singleplayer-btn">Singleplayer</button>
            <button id="multiplayer-btn">Multiplayer</button>
        </div>

        <div style="margin-top: 20px;">
            <label>Skin: </label>
            <select id="theme-selector">
                <option value="theme-classic">Classic</option>
                <option value="theme-dark">Dark Mode</option>
                <option value="theme-neon">Neon</option>
            </select>
        </div>
    </div>

    <div id="server-browser-screen" class="screen hidden">
        <h2>Server Browser</h2>
        <div style="margin-bottom: 20px;">
            <button id="show-create-room-btn">Create Room</button>
            <button id="back-to-login-btn">Back</button>
        </div>
        <ul id="public-rooms-list" style="max-height: 300px; overflow-y: auto; text-align: left; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 5px;">
            <li>No public rooms available.</li>
        </ul>
    </div>

    <div id="create-room-modal" class="modal hidden">
        <div class="modal-content" style="color: black;">
            <h3 style="color: white;">Create Room</h3>
            <input type="text" id="room-name-input" placeholder="Room Name" style="margin-bottom: 10px; width: 80%;"/><br>
            <label style="color: white;">Max Players: <input type="number" id="room-max-players" value="4" min="2" max="10" style="width: 50px;"/></label><br><br>
            <label style="color: white;"><input type="checkbox" id="room-private-checkbox" /> Private Room</label><br><br>
            <button id="create-room-confirm-btn">Create</button>
            <button id="create-room-cancel-btn">Cancel</button>
        </div>
    </div>

    <div id="lobby-screen" class="screen hidden">
        <h2>Lobby <span id="lobby-id-display" style="font-size: 0.6em; color: #ccc;"></span></h2>
        <ul id="players-list"></ul>
        <div id="host-controls" class="hidden" style="margin-top: 20px; padding-top: 10px; border-top: 1px solid #555;">
            <h4>Host Controls</h4>
            <div style="margin-bottom: 10px;">
                <select id="bot-difficulty">
                    <option value="easy">Easy Bot</option>
                    <option value="medium">Medium Bot</option>
                    <option value="hard">Hard Bot</option>
                </select>
                <button id="add-bot-btn">Add Bot</button>
            </div>
            <button id="start-btn">Start Game</button>
        </div>
        <p id="waiting-msg">Waiting for host to start...</p>
    </div>

    <div id="game-screen" class="screen hidden">
        <div id="opponents"></div>
        <div class="center-board">
            <div id="deck" class="card deck-card">UNO</div>
            <div id="discard-pile" class="card"></div>
        </div>
        <div class="player-area">
            <h3 id="my-name">My Hand</h3>
            <div id="my-hand" class="hand"></div>
        </div>
        
        <!-- Modal for selecting color after playing wild card -->
        <div id="color-picker" class="modal hidden">
            <div class="modal-content">
                <h3>Select Color</h3>
                <div class="color-options">
                    <button class="color-btn red" data-color="red"></button>
                    <button class="color-btn blue" data-color="blue"></button>
                    <button class="color-btn green" data-color="green"></button>
                    <button class="color-btn yellow" data-color="yellow"></button>
                </div>
            </div>
        </div>
    </div>

    <div id="game-over-screen" class="screen hidden">
        <h1 id="winner-message"></h1>
        <button id="play-again-btn">Play Again</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="client.js"></script>
</body>
</html>
